<!DOCTYPE html>
<html lang="en">
<head>
  <title>Mortgage Payment Calculator</title>
  <link rel="stylesheet" href="mortgage repayment calculator.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <div class="mortgage-calculator-container">
          <div class="calculator">
            <div class="title">
              <h1 class="heading">Mortgage Calculator</h1>
              <p class="clear">Clear All</p>
            </div>
            <p>Mortgage Amount</p>
            <span></span><input type="text">
            <div class="input-container">
              <div>
              <p>Mortgage Term</p>
              <div class="input-box">
                  <input type="number"> <span>years</span> 
              </div>
            </div>
            <div>
              <p>Interest Rate</p>
              <div class="input-box">
                  <input type="number"> <span>%</span>
              </div>
            </div>
          </div>
            <p>Mortgage Type</p>
            <div class="input-radio-button">
              <input type="radio"> <span>Repayment</span>
            </div>
            <div class="input-radio-button"> 
              <input type="radio"> <span>Interest Only</span>
           </div>
           <button> <img src="image/icon-calculator.svg"><span>Calculate Repayments</span></button>
        </div>
    <div class="description-result">
      <img src="image/illustration-empty.svg" alt="">
      <h1 class="title-result">Results shown here</h1>
      <p class="info-text">Complete the form and click "calaulate repayments" to see what your monthly repayments would be.</p>
    </div>
    </div>
  </div>

</body>
</html>

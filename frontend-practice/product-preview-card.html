<!DOCTYPE html>
<html lang="en">
<head>
    <title>Product Card</title>
    <style>
        .back-cover{
            display: flex;
            align-items: center;
            justify-content: center;
            background-color:  hsl(30, 38%, 92%);
            position: fixed;
            top: 50px;
            bottom: 50px;
            right: 70px;
            left: 70px;
        }
        .container{
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: white;
            border-radius: 6px;
        }
        .description{
            padding: 0 20px 0 20px;
            display: flex;
            flex-direction: column;
        }
        img{
            width: 235px;
            height: 370px;
            border-top-left-radius: 6px;
            border-bottom-left-radius: 6px;
        }
        .subject{
            letter-spacing: 5px;
            font-size: 11px;
            color: hsl(228, 12%, 48%);
        }
        p{
            width: 190px;
            line-height: 20px;
            color: hsl(228, 12%, 48%);
            margin-bottom: 25px;
            font-size: 14px;
        }
        h1{
            width: 200px;
            margin: 19px 0 10px 0;
            line-height: 27px;
        }
        .amount{
            margin-bottom: 20px;
            font-size: 28px;
            font-weight: bold;
            display: flex;
            align-items: center;
            color: hsl(158, 36%, 37%);
        }
        span{
            font-size: 12px;
            margin-left: 15px;
            color: hsl(228, 12%, 48%);
            text-decoration: line-through;
        }
        button{
            color: hsl(0, 0%, 100%);
            background-color: hsl(158, 36%, 37%);
            border: none;
            padding: 10px 20px 10px 20px;
            border-radius: 7px;
            cursor: pointer;
        }
        button:active{
            background-color:  hsl(161, 56%, 14%);
        }
    </style>
</head>
<body>
    <div class="back-cover">
        <div class="container">
            <img src="image/image-product-desktop.jpg" alt="image-product">
             <div class="description">
                <div class="subject">PERFUME</div>
             <h1>Gabrielle Essence Eau De Parfum</h1>  
             <p>A floral, solar and voluptuous interpretation
                composed by Olivier Polge, Perfumer-Creator
                for the House of CHANEL.
             </p> 
             <div class="amount">$149.99 <span>$169.99</span></div>    
                 <button>
                    <svg width="15" height="16" xmlns="http://www.w3.org/2000/svg"><path d="M14.383 10.388a2.397 2.397 0 0 0-1.518-2.222l1.494-5.593a.8.8 0 0 0-.144-.695.8.8 0 0 0-.631-.28H2.637L2.373.591A.8.8 0 0 0 1.598 0H0v1.598h.983l1.982 7.4a.8.8 0 0 0 .799.59h8.222a.8.8 0 0 1 0 1.599H1.598a.8.8 0 1 0 0 1.598h.943a2.397 2.397 0 1 0 4.507 0h1.885a2.397 2.397 0 1 0 4.331-.376 2.397 2.397 0 0 0 1.12-2.021ZM11.26 7.99H4.395L3.068 3.196h9.477L11.26 7.991Zm-6.465 6.392a.8.8 0 1 1 0-1.598.8.8 0 0 1 0 1.598Zm6.393 0a.8.8 0 1 1 0-1.598.8.8 0 0 1 0 1.598Z" fill="#FFF"/></svg>
                    Add to Cart                    
                 </button>
             </div>
        </div>
    </div>
</body>
</html>

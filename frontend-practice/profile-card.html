<!DOCTYPE html>
<html lang="en">
<head>
    <title> Profile Card</title>
    <style>
        .back-cover{
            background-color:  hsl(185, 75%, 39%);
            display: flex;
            align-items: center;
            justify-content: center;
            position: fixed;
            top: 150px;
            bottom: 150px;
            right: 150px;
            left: 150px;
            overflow: hidden;
        }
        .container{
            background-color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 15px;
            position: relative;
        }
        .container-top{
            border-top-left-radius: 15px;
            border-top-right-radius: 15px;
        }
        .name{
            font-size: 18px;
            margin-top: 75px;
            font-weight: 700;
        }
        .country{
            margin-top: 10px;
            margin-bottom: 25px;
            color:  hsl(0, 0%, 59%);
        }
        .stats{
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-top: 1px solid lightgrey;
            width: 270px;
            padding: 30px 40px 30px 40px;
        }
        .followers{
            display: flex;
            flex-direction: column;
            align-items: center;
            font-weight:700;
            font-size: 18px;
        }
        span{
            font-weight:100;
            font-size: 14px;
            letter-spacing: 2px;
            color: hsl(227, 10%, 46%);
        }
        .number{
            letter-spacing: normal;
            font-size: 18px;
            color: grey;
        }
        img{
            border-radius: 55px;
            position:absolute;
            top: 90px;
            border: 7px solid white;
        }
    </style>
</head>

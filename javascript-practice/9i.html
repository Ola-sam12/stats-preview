<!DOCTYPE html>
<html lang="en">
<head>
  <title>10 exercise</title>
  <style>
    
    .toggle-button{
      background-color: rgb(230, 230, 230);;
      color: black;
      padding: 10px 15px;
      margin-right: 10px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    .is-toggle{
      background-color: black;
      color: white;
    }
    .subscribe-button{
      background-color: black;
      color: white;
      border: none;
      font-family: arial;
      padding: 10px 17px;
      border-radius: 19px;
      cursor: pointer;
    }
    .is-subscribe{
      background-color: rgb(230, 230, 230);
      color: black;
    }
  
  </style>

</head>
<body>

  <button onclick="
    subscribeButton();
    " class="js-subscribe-button subscribe-button">subscribe</button>
  
 <button onclick="
  testingButton();
  " class="js-game-button toggle-button">
  Gaming
 </button>
 <button onclick="
  testingButton();
  " class="js-game-button toggle-button">
  Music
</button>
   <script>

    function subscribeButton() {
      const buttonElem = document.querySelector('.js-subscribe-button')

      if (buttonElem.innerText === 'subscribe') {
      buttonElem.innerText = 'subscribed'
      buttonElem.classList.add('is-subscribe')
      } else {
      buttonElem.innerText = 'subscribe'
      buttonElem.classList.remove('is-subscribe')
      }
    }
    
  function testingButton() {
    const buttonElement = document.querySelector('.js-game-button');

    if (!buttonElement.classList.contains('is-toggle')) {
      buttonElement.classList.add('is-toggle');
    } else {
      buttonElement.classList.remove('is-toggle');
    }
  }
  
   </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <title>Rock Paper Scissors Game</title>
  <link rel="stylesheet" href="styles/rock-paper-scissors.css">
</head>
<body>
  <p class="title">Rock Paper Scissors</p>

  <button onclick="
    playGame('rock');
  " class="move-button"><img class="move-icon" src="image/rock-emoji.png" alt=""></button>

  <button onclick="
    playGame('paper');
  " class="move-button"><img class="move-icon" src="image/paper-emoji.png" alt=""></button>

  <button onclick="
    playGame('scissors');
  " class="move-button"><img class="move-icon" src="image/scissors-emoji.png" alt=""></button> 

  <p class="js-result result"></p>
  <p class="js-moves"></p>
  <p class="js-score score"></p>

  <button onclick="
    score.wins = 0
    score.losses = 0
    score.ties = 0
    localStorage.removeItem('score');
    updateScoreElement();
  " class="rest-score-button">Reset score</button>
  <script src="script/rock-paper-scissors.js"></script>
  </body>
</html>

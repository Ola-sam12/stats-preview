<!DOCTYPE html>
<html lang="en">
<head>
  <title>coinflip Game</title>
</head>
<body>

  <button onclick="
  playGame();
  onPage();
  document.querySelector('.js-options').innerHTML = 'You choose: heads'
    ">
    heads
  </button>
  
  <button onclick="
  playGame();
  onPage();
  document.querySelector('.js-options').innerHTML = 'You choose: tails';
  ">
    tails
  </button>
  <p class="js-options"></p>
  <p class="js-result"></p>
  <p class="js-score"></p>

<p>
  <button onclick="
  score.wins = 0,
  score.losses = 0
   localStorage.removeItem('score')
   onPage();
  ">Rest Button</button>
</p>

   <script>
      let score = JSON.parse(localStorage.getItem('score')) || {
          wins: 0,
          losses: 0
        };

        console.log(score);
        /*
      if (score === null) {
        score = {
          wins: 0,
          losses: 0
        }
      }
      */
     function onPage() {
      const predict = playGame();
        document.querySelector('.js-result').innerHTML = `${predict}`

        document.querySelector('.js-score'). innerHTML = `wins: ${score.wins} losses: ${score.losses}`;
     };
     
       onPage();


      function playGame(predict) {
        const randomNumber = Math.random();

        let result = '';

        if (randomNumber <= 0.5) {
          result = 'heads';
        } else {
          result = 'tails';
        };

        if (result === 'heads') {
          predict = 'you win'
        } else {
          predict = 'you lose'
        };

        if (predict === 'you win') {
          score.wins++
        } else {
          score.losses++
        };

        return predict;
        localStorage.setItem('score', JSON.stringify(score));
      };
       

  </script>
</body>
</html>

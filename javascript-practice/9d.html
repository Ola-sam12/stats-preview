<!DOCTYPE html>
<html lang="en">
<head>
  <title>DOM</title>
</head>
<body>
  <input placeholder="Name" class="js-name" onkeydown="
    keyEvents(event);
    ">
  <button onclick="
    nameDisplay();
  ">Submit</button>
  <p class="js-full-name"></p>
  <script>

    function keyEvents (event) {
      if (event.key === 'Enter') {
        nameDisplay();
      }
    }

    function nameDisplay() {
      const nameInput = document.querySelector('.js-name'); 
      const nameValue = nameInput.value;

      document.querySelector('.js-full-name').innerHTML = `Your Name is: ${nameValue}`
    }
  </script>
</body> 
</html>

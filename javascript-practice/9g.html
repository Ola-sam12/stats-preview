<!DOCTYPE html>
<html lang="en">
<head>
  <title>Document</title>
</head>
<body>
  <input type="text" class="js-value">
  <button onclick="
    totalCost();
  " class="js-calculate-button">Calculate</button>
  <p class="js-total"></p>

  <input type="text" placeholder="Type Something" onkeyup="
    keyEvent(event)
  ">
  <p class="js-keyup"></p>
  <script>

    function keyEvent(event) {
      document.querySelector('.js-keyup').innerHTML = event.key;
    }

    function totalCost () {
      let costValue = Number(document.querySelector('.js-value').value);
      
      if (costValue < 40) {
       costValue += 10
      } 
       document.querySelector('.js-total').innerHTML = `$${Math.round(costValue) }`
    }
       
     document.body.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') {
        totalCost();
      }
     });
  </script>
</body>
</html>

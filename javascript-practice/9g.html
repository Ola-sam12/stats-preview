<!DOCTYPE html>
<html lang="en">
<head>
  <title>Document</title>
</head>
<body>
  <input type="text" class="js-value">
  <button onclick="
    totalCost();
  ">Calculate</button>
  <p class="js-total"></p>

  <input type="text" placeholder="Type Something" onkeyup="
    keyEvent (event)
  ">
  <p class="js-keyup"></p>
  <script>

    function keyEvent(event) {
      document.querySelector('.js-keyup').innerHTML = event.key;
    }

    function totalCost () {
      const costValue = Number(document.querySelector('.js-value').value);
      const document.querySelector('.js-total').innerHTML = `$${Math.round(costValue + 10) }`
    }


  </script>
</body>
</html>
